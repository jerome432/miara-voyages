        document.getElementById('importBtn').addEventListener('click', async () => {
            const btn = document.getElementById('importBtn');
            const status = document.getElementById('status');

            btn.disabled = true;
            status.className = 'status loading';
            status.textContent = 'Import en cours...';

            try {
                if (!auth.currentUser) {
                    throw new Error('Vous devez etre connecte');
                }

                voyageData.createdBy = auth.currentUser.uid;

                await addDoc(collection(db, 'voyages'), voyageData);

                status.className = 'status success';
                status.innerHTML = `
                    ✅ <strong>Voyage importe avec succes !</strong><br><br>
                    Le Road Trip Adriatique 2026 avec ses 13 destinations est maintenant dans Firestore.<br><br>
                    <a href="admin-dashboard.html" style="color: #155724; text-decoration: underline;">
                        Retourner au dashboard
                    </a>
                `;

            } catch (error) {
                console.error('Erreur import:', error);
                status.className = 'status error';
                status.innerHTML = `
                    ❌ <strong>Erreur lors de l'import</strong><br>
                    ${error.message}<br><br>
                    Assurez-vous d'etre connecte a l'admin.
                `;
                btn.disabled = false;
            }
