<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miara Voyages - Nos aventures à travers le monde</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Cormorant+Garamond:wght@300;400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --noir: #1A1A1A;
            --or-rose: #B76E79;
            --gris-perle: #F8F8F8;
            --anthracite: #424242;
            --blanc: #FFFFFF;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--anthracite);
            background: var(--noir);
            overflow-x: hidden;
        }

        /* BURGER MENU */
        .burger-menu {
            position: fixed;
            top: 2rem;
            right: 2rem;
            z-index: 1000;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 6px;
            transition: all 0.3s;
        }

        .burger-menu span {
            display: block;
            width: 100%;
            height: 2px;
            background: var(--blanc);
            transition: all 0.3s;
        }

        .burger-menu.active span:nth-child(1) {
            transform: rotate(45deg) translate(8px, 8px);
        }

        .burger-menu.active span:nth-child(2) {
            opacity: 0;
        }

        .burger-menu.active span:nth-child(3) {
            transform: rotate(-45deg) translate(8px, -8px);
        }

        /* MENU OVERLAY */
        .menu-overlay {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background: var(--noir);
            z-index: 999;
            transition: right 0.3s ease;
            padding: 6rem 3rem 3rem;
            box-shadow: -5px 0 20px rgba(0,0,0,0.3);
        }

        .menu-overlay.active {
            right: 0;
        }

        .menu-overlay nav {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .menu-overlay a {
            color: var(--blanc);
            text-decoration: none;
            font-size: 1.5rem;
            font-family: 'Playfair Display', serif;
            transition: all 0.3s;
            padding: 1rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .menu-overlay a:hover {
            color: var(--or-rose);
            padding-left: 1rem;
        }

        .menu-user-info {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255,255,255,0.2);
            color: var(--gris-perle);
            font-size: 0.9rem;
        }

        .menu-user-info .user-email {
            color: var(--or-rose);
            font-weight: 500;
            margin-bottom: 1rem;
        }

        .btn-logout-menu {
            background: transparent;
            border: 1px solid var(--or-rose);
            color: var(--or-rose);
            padding: 0.8rem 1.5rem;
            cursor: pointer;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.3s;
            width: 100%;
        }

        .btn-logout-menu:hover {
            background: var(--or-rose);
            color: var(--blanc);
        }

        /* HERO SECTION */
        .hero {
            position: relative;
            height: 60vh;
            min-height: 500px;
            overflow: hidden;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 0,5rem;
        }

        .hero-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 40%;
            filter: brightness(0.6);
        }

        .hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
            color: var(--blanc);
            padding: 0,5rem 2rem;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 6vw, 5rem);
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: 0.02em;
        }

        .hero p {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            font-weight: 300;
            opacity: 0.9;
        }

        /* MAIN CONTENT */
        .main-content {
            background: var(--gris-perle);
            padding: 6rem 2rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 4vw, 3rem);
            text-align: center;
            margin-bottom: 4rem;
            color: var(--noir);
        }

        /* VOYAGES SLIDER */
        .voyages-slider {
            display: flex;
            gap: 2rem;
            overflow-x: auto;
            padding: 1rem 0 2rem;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }

        .voyages-slider::-webkit-scrollbar {
            height: 8px;
        }

        .voyages-slider::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
            border-radius: 4px;
        }

        .voyages-slider::-webkit-scrollbar-thumb {
            background: var(--or-rose);
            border-radius: 4px;
        }

        .voyage-card {
            flex: 0 0 400px;
            scroll-snap-align: start;
            background: var(--blanc);
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            transition: all 0.3s;
            text-decoration: none;
            color: inherit;
        }

        .voyage-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .voyage-card-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .voyage-card-content {
            padding: 2rem;
        }

        .voyage-card h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            margin-bottom: 1rem;
            color: var(--noir);
        }

        .voyage-meta {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            color: var(--anthracite);
        }

        .voyage-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(0,0,0,0.1);
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--or-rose);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--anthracite);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* COMING SOON CARD */
        .coming-soon-card {
            flex: 0 0 400px;
            scroll-snap-align: start;
            background: linear-gradient(135deg, var(--noir) 0%, var(--anthracite) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 450px;
            color: var(--blanc);
            text-align: center;
            padding: 2rem;
        }

        .coming-soon-content {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            opacity: 0.7;
        }

        /* STATS SECTION */
        .stats-section {
            margin-top: 6rem;
            padding: 4rem 2rem;
            background: var(--blanc);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 3rem;
            max-width: 1000px;
            margin: 0 auto;
        }

        .global-stat {
            text-align: center;
        }

        .global-stat-number {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            font-weight: 700;
            color: var(--or-rose);
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        .global-stat-label {
            font-size: 1rem;
            color: var(--anthracite);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* FOOTER */
        footer {
            background: var(--noir);
            color: var(--blanc);
            padding: 3rem 2rem 2rem;
            text-align: center;
        }

        .footer-logo {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 2rem;
            letter-spacing: 0.1em;
        }

        .footer-nav {
            display: flex;
            gap: 2rem;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .footer-nav a {
            color: var(--gris-perle);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .footer-nav a:hover {
            color: var(--or-rose);
        }

        .footer-copyright {
            font-size: 0.85rem;
            opacity: 0.6;
            margin-top: 2rem;
        }

        @media (max-width: 768px) {
            .burger-menu {
                top: 1.5rem;
                right: 1.5rem;
            }

            .menu-overlay {
                max-width: 100%;
            }

            .voyage-card {
                flex: 0 0 300px;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 2rem;
            }

            .global-stat-number {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <!-- Burger Menu -->
    <div class="burger-menu" id="burgerMenu">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- Menu Overlay -->
    <div class="menu-overlay" id="menuOverlay">
        <nav>
            <a href="index.html">Accueil</a>
            <a href="#voyages">Voyages</a>
            <a href="#about">À propos</a>
            <a href="login.html" id="menuLoginLink">🔐 Connexion</a>
            <a href="admin-login.html" id="menuAdminLink" style="display: none;">📊 Admin</a>
        </nav>
        <div class="menu-user-info" id="menuUserInfo" style="display: none;">
            <div class="user-email" id="menuUserEmail"></div>
            <button class="btn-logout-menu" id="menuLogoutBtn">Déconnexion</button>
        </div>
    </div>

    <!-- Hero Section -->
    <section class="hero">
        <img src="images/famille-miara.jpg" alt="Famille Miara" class="hero-image">
        <div class="hero-content">
            <h1>Miara Voyages</h1>
            <p>Nos aventures à travers le monde</p>
        </div>
    </section>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <h2 class="section-title">Carnets de Voyage</h2>
            
            <div class="voyages-slider" id="voyagesSlider">
                <!-- Voyages will be loaded here dynamically -->
                <div class="coming-soon-card">
                    <div class="coming-soon-content">
                        ✈️<br>
                        Prochaines aventures<br>
                        à venir...
                    </div>
                </div>
            </div>
        </div>

        <!-- Stats Section -->
        <section class="stats-section">
            <div class="stats-grid">
                <div class="global-stat">
                    <div class="global-stat-number" id="totalVoyages">0</div>
                    <div class="global-stat-label">Voyages</div>
                </div>
                <div class="global-stat">
                    <div class="global-stat-number" id="totalPays">0</div>
                    <div class="global-stat-label">Pays</div>
                </div>
                <div class="global-stat">
                    <div class="global-stat-number" id="totalKm">0</div>
                    <div class="global-stat-label">Kilomètres</div>
                </div>
                <div class="global-stat">
                    <div class="global-stat-number" id="totalDestinations">0</div>
                    <div class="global-stat-label">Destinations</div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-logo">MIARA</div>
        <nav class="footer-nav">
            <a href="index.html">Accueil</a>
            <a href="#voyages">Voyages</a>
            <a href="#about">À propos</a>
            <a href="login.html">Connexion</a>
        </nav>
        <div class="footer-copyright">
            © 2026 Miara Voyages - Tous droits réservés
        </div>
    </footer>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, collection, getDocs, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyD6uJDRmjZNXyUvwiW7lxUyXKFDU0pC-eA",
            authDomain: "miara-voyages-2.firebaseapp.com",
            projectId: "miara-voyages-2",
            storageBucket: "miara-voyages-2.firebasestorage.app",
            messagingSenderId: "375390867380",
            appId: "1:375390867380:web:9a2b1887941ad062a16ce1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Burger Menu Toggle
        const burgerMenu = document.getElementById('burgerMenu');
        const menuOverlay = document.getElementById('menuOverlay');

        burgerMenu.addEventListener('click', () => {
            burgerMenu.classList.toggle('active');
            menuOverlay.classList.toggle('active');
        });

        // Close menu when clicking outside
        menuOverlay.addEventListener('click', (e) => {
            if (e.target === menuOverlay) {
                burgerMenu.classList.remove('active');
                menuOverlay.classList.remove('active');
            }
        });

        // Auth State Management
        onAuthStateChanged(auth, async (user) => {
            const menuLoginLink = document.getElementById('menuLoginLink');
            const menuAdminLink = document.getElementById('menuAdminLink');
            const menuUserInfo = document.getElementById('menuUserInfo');
            const menuUserEmail = document.getElementById('menuUserEmail');

            if (user) {
                // User is logged in
                menuLoginLink.style.display = 'none';
                menuUserInfo.style.display = 'block';
                menuUserEmail.textContent = user.email;

                // Check if admin
                try {
                    const userDoc = await getDoc(doc(db, 'users', user.uid));
                    if (userDoc.exists() && userDoc.data().role === 'admin') {
                        menuAdminLink.style.display = 'block';
                    }
                } catch (error) {
                    console.error('Error checking admin status:', error);
                }
            } else {
                // User is not logged in
                menuLoginLink.style.display = 'block';
                menuAdminLink.style.display = 'none';
                menuUserInfo.style.display = 'none';
            }
        });

        // Logout
        document.getElementById('menuLogoutBtn').addEventListener('click', async () => {
            try {
                await signOut(auth);
                burgerMenu.classList.remove('active');
                menuOverlay.classList.remove('active');
                alert('Déconnexion réussie');
            } catch (error) {
                console.error('Logout error:', error);
                alert('Erreur lors de la déconnexion');
            }
        });

        // Load Voyages
        async function loadVoyages() {
            try {
                const voyagesSnapshot = await getDocs(collection(db, 'voyages'));
                const voyages = [];
                
                voyagesSnapshot.forEach((doc) => {
                    voyages.push({ id: doc.id, ...doc.data() });
                });

                displayVoyages(voyages);
                updateStats(voyages);
            } catch (error) {
                console.error('Error loading voyages:', error);
            }
        }

        function displayVoyages(voyages) {
            const slider = document.getElementById('voyagesSlider');
            
            if (voyages.length === 0) {
                return; // Keep coming soon card
            }

            slider.innerHTML = voyages.map(voyage => {
                const photoUrl = voyage.photoCouverture || 'https://via.placeholder.com/400x250/1A1A1A/B76E79?text=' + encodeURIComponent(voyage.titre);
                const voyageUrl = voyage.slug ? `${voyage.slug}.html` : 'adriatique-2026.html';
                
                return `
                    <a href="${voyageUrl}" class="voyage-card">
                        <img src="${photoUrl}" alt="${voyage.titre}" class="voyage-card-image" onerror="this.src='https://via.placeholder.com/400x250/1A1A1A/B76E79?text=${encodeURIComponent(voyage.titre)}'">
                        <div class="voyage-card-content">
                            <h3>${voyage.titre || 'Sans titre'}</h3>
                            <div class="voyage-meta">
                                <span>${voyage.pays || ''}</span>
                                <span>${voyage.dateDebut && voyage.dateFin ? formatDateRange(voyage.dateDebut, voyage.dateFin) : ''}</span>
                            </div>
                            <div class="voyage-stats">
                                <div class="stat-item">
                                    <div class="stat-number">${voyage.etapes?.length || 0}</div>
                                    <div class="stat-label">Étapes</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-number">${voyage.distance || 0}</div>
                                    <div class="stat-label">Km</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-number">${voyage.duree || 0}</div>
                                    <div class="stat-label">Jours</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-number">${countCountries(voyage.pays)}</div>
                                    <div class="stat-label">Pays</div>
                                </div>
                            </div>
                        </div>
                    </a>
                `;
            }).join('') + `
                <div class="coming-soon-card">
                    <div class="coming-soon-content">
                        ✈️<br>
                        Prochaines aventures<br>
                        à venir...
                    </div>
                </div>
            `;
        }

        function updateStats(voyages) {
            const totalVoyages = voyages.length;
            let totalKm = 0;
            let totalDestinations = 0;
            const countries = new Set();

            voyages.forEach(voyage => {
                totalKm += voyage.distance || 0;
                totalDestinations += voyage.etapes?.length || 0;
                
                if (voyage.pays) {
                    const flags = voyage.pays.match(/[\u{1F1E6}-\u{1F1FF}]/gu) || [];
                    flags.forEach(flag => countries.add(flag));
                }
            });

            document.getElementById('totalVoyages').textContent = totalVoyages;
            document.getElementById('totalPays').textContent = countries.size;
            document.getElementById('totalKm').textContent = totalKm.toLocaleString();
            document.getElementById('totalDestinations').textContent = totalDestinations;
        }

        function formatDateRange(start, end) {
            const startDate = new Date(start);
            const endDate = new Date(end);
            const options = { day: 'numeric', month: 'short' };
            
            return `${startDate.toLocaleDateString('fr-FR', options)} - ${endDate.toLocaleDateString('fr-FR', options)} ${endDate.getFullYear()}`;
        }

        function countCountries(paysString) {
            if (!paysString) return 0;
            const flags = paysString.match(/[\u{1F1E6}-\u{1F1FF}]/gu) || [];
            return new Set(flags).size;
        }

        // Load voyages on page load
        loadVoyages();
    </script>
</body>
</html>
