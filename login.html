<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Miara Voyages</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,600&family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --sand: #F4EFE6;
            --terracotta: #D4755E;
            --deep-blue: #1B3A52;
            --ocean: #4A8BA5;
            --cream: #FFF9F0;
            --charcoal: #2B2D2F;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, var(--deep-blue) 0%, var(--ocean) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .login-container {
            background: white;
            border-radius: 25px;
            padding: 3rem;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        h1 {
            font-family: 'Instrument Serif', serif;
            font-size: 2.5rem;
            font-style: italic;
            color: var(--deep-blue);
            text-align: center;
            margin-bottom: 0.5rem;
        }
        
        .subtitle {
            text-align: center;
            color: var(--charcoal);
            opacity: 0.7;
            margin-bottom: 2rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--charcoal);
        }
        
        input {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--sand);
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: var(--ocean);
            box-shadow: 0 0 0 3px rgba(74, 139, 165, 0.1);
        }
        
        .btn-login {
            width: 100%;
            padding: 1rem;
            background: var(--terracotta);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'DM Sans', sans-serif;
        }
        
        .btn-login:hover {
            background: #c4654e;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(212, 117, 94, 0.3);
        }
        
        .btn-login:active {
            transform: translateY(0);
        }
        
        .forgot-password {
            text-align: center;
            margin-top: 1rem;
        }
        
        .forgot-password a {
            color: var(--ocean);
            text-decoration: none;
            font-size: 0.9rem;
        }
        
        .forgot-password a:hover {
            text-decoration: underline;
        }
        
        .divider {
            text-align: center;
            margin: 2rem 0;
            position: relative;
        }
        
        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 1px;
            background: var(--sand);
        }
        
        .divider span {
            background: white;
            padding: 0 1rem;
            position: relative;
            color: var(--charcoal);
            opacity: 0.5;
            font-size: 0.9rem;
        }
        
        .back-link {
            text-align: center;
            margin-top: 2rem;
        }
        
        .back-link a {
            color: var(--ocean);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .back-link a:hover {
            text-decoration: underline;
        }
        
        .info-box {
            background: #FFF3E0;
            border-left: 4px solid #FF9800;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 2rem;
            font-size: 0.9rem;
        }
        
        .info-box strong {
            display: block;
            margin-bottom: 0.5rem;
            color: #E65100;
        }
        
        @media (max-width: 480px) {
            .login-container {
                padding: 2rem 1.5rem;
            }
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>✈️</h1>
        </div>
        
        <h1>Connexion</h1>
        <p class="subtitle">Miara Voyages</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="jerome.miara@groupe-obea.com"
                    required
                >
            </div>
            
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="••••••••"
                    required
                >
            </div>
            
            <button type="submit" class="btn-login">
                Se connecter
            </button>
            
            <div class="forgot-password">
                <a href="#" onclick="alert('Fonctionnalité à venir avec Firebase'); return false;">
                    Mot de passe oublié ?
                </a>
            </div>
        </form>
        
        <div class="divider">
            <span>ou</span>
        </div>
        
        <div class="back-link">
            <a href="index.html">← Retour à l'accueil</a>
        </div>
        
        <div class="info-box">
            <strong>🔧 Configuration en cours</strong>
            L'authentification Firebase sera activée prochainement. Pour l'instant, cette page est une maquette.
        </div>
    </div>
    
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // TODO: Intégrer Firebase Authentication
            alert('🔧 Authentification Firebase à configurer\n\nPour l\'instant, cette page est une maquette.\nL\'authentification sera activée dans la prochaine étape.');
            
            // Pour le moment, redirection vers l'accueil
            // window.location.href = 'index.html';
        });
    </script>
</body>
</html>
